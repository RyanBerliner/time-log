<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test / Manual / Timeline / DOW Indicator</title>
    <script src="../test.js"></script>
    <style>
      @import "../test.css";
      @import "../../../src/timeline/dow-indicator.css";

      body { padding: var(--spacer); }
      #root > * { margin-bottom: var(--spacer); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import DOWIndicator from 'root/timeline/dow-indicator.js';

      const root = document.getElementById('root');

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const test = DOWIndicator(d);
        root.appendChild(test);
      }
    </script>
  </body>
</html>
