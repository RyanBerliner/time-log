<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test / Manual / Timeline / Day</title>
    <script src="../test.js"></script>
    <style>
      @import "../test.css";
      @import "../../../src/button.css";
      @import "../../../src/timeline/day-date.css";
      @import "../../../src/timeline/day-minutes.css";
      @import "../../../src/timeline/day.css";
      @import "../../../src/timeline/dow-indicator.css";
      @import "../../../src/timeline/hour-block.css";

      .add-hour-button-funcs { margin: calc(var(--spacer) * 2) 0; }
      .add-hour-button-funcs > button:last-child { margin-left: var(--spacer); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { $, on, off } from 'lib/node.js';

      import Day, {
        AddHourButton,
        showAddHourButton,
        removeAddHourButton,
      } from 'root/timeline/day.js';
      import DOWIndicator from 'root/timeline/dow-indicator.js';
      import DayDate from 'root/timeline/day-date.js';
      import DayMinutes from 'root/timeline/day-minutes.js';
      import HourBlock from 'root/timeline/hour-block.js';

      const root = document.getElementById('root');

      // make sure the skeleton looks OK
      let test = Day({
        $DayDate: $('div', ['day date']),
        $DOWIndicator: $('div', ['dow indicator']),
        $AddHourButton: $('div', ['The add hour button']),
        $DayMinutes: $('div', ['1h']),
        hourNodes: [
          $('li', ['hour 1']),
          $('li', ['hour 2']),
          $('li', ['hour 3']),
        ],
      });
      root.appendChild(test);

      // empty list should show correctly
      test = Day({
        $DayDate: $('div', ['day date']),
        $DOWIndicator: $('div', ['dow indicator']),
        $AddHourButton: $('div', ['The add hour button']),
        $DayMinutes: $('div', ['1h']),
        hourNodes: [],
      });
      root.appendChild(test);

      // [show|remove]AddHourButton testing
      const $Day = Day({
        $DayDate: $('div', ['day date']),
        $DOWIndicator: $('div', ['dow indicator']),
        $AddHourButton: $('button', ['+'], node => {
          // simple click event so we can make sure its persistant between
          // unmounting and remounting
          return on(node, 'click', e => alert('add hour!'));
        }),
        $DayMinutes: $('div', ['1h']),
        hourNodes: [
          $('li', ['hour 1']),
          $('li', ['hour 2']),
          $('li', ['hour 3']),
        ],
      });

      const $Toggle = $('button.primary', ['Toggle Button']);
      let showing = true;

      on($Toggle, 'click', () => {
        if (showing) {
          removeAddHourButton($Day);
        } else {
          showAddHourButton($Day);
        }

        showing = !showing;
      });

      root.appendChild($('div.add-hour-button-funcs', [$Day, $Toggle]));

      // and finally a nicely composed example of everything together as it
      // might appear in the app
      for (let i = 0; i < 7; i++) {
        let date = new Date();
        date.setDate(date.getDate() + i);
        const $AddHourButton = AddHourButton(date);

        const $DayDate = DayDate(date);
        const $DOWIndicator = DOWIndicator(date);
        const $DayMinutes = DayMinutes(i === 3 ? 0 : 200);

        test = Day({
          $DayDate,
          $DOWIndicator,
          $AddHourButton,
          $DayMinutes,
          hourNodes: i === 3 ? [] : [
            $('li', [HourBlock({minutes: 65, label: 'hour block 1'})]),
            $('li', [HourBlock({minutes: 65, label: 'hour block 2'})]),
            $('li', [HourBlock({minutes: 65, label: 'hour block 3'})]),
          ],
        });
        root.appendChild(test);
      }
    </script>
  </body>
</html>
